name: Cloudflare backend checks

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-backend.yml"
  push:
    branches:
      - main
      - "feature/cloudflare-durable-objects"
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-backend.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - name: Install dependencies
        working-directory: cloudflare
        run: npm install
      - name: TypeScript check
        working-directory: cloudflare
        run: npm run typecheck
