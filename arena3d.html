(function(){
 var box=document.getElementById("diagnostic"),msg=document.getElementById("diagnosticText");
 function fail(label,detail){box.style.display="block";msg.textContent=label+"\\n"+String(detail||"Unknown error").slice(0,1800);var l=document.getElementById("loading");if(l)l.style.display="none";}
