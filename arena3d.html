<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b17"><title>Mythbeasts Clash — 3D Arena</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a14;color:#f4d58a;font-family:Georgia,serif;touch-action:none}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:14px;letter-spacing:2px;text-shadow:0 2px 12px #000}.brand b{display:block;color:#fff0c2;font-size:clamp(20px,5vw,30px)}.phase{text-align:right;font-size:11px;letter-spacing:2px;color:#c9d7ff}.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.fighter-label{display:flex;justify-content:space-between;margin:0 2px 5px;color:#d8d9ed;font:700 9px/1.2 system-ui;letter-spacing:1.6px;text-transform:uppercase}.fighter-label span:last-child{color:#f1d59b}.bar{height:9px;background:#11182c;border:1px solid #c49a50;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4de0a1,#d6f6a5)}.bar.enemy i{background:linear-gradient(90deg,#d12b52,#ff9b75)}.bottom{display:flex;flex-direction:column-reverse;align-items:stretch;gap:10px}.caption{width:100%;max-width:100%;font-size:12px;letter-spacing:1px;color:#e8e4ff;text-shadow:0 2px 8px #000}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;pointer-events:auto;justify-content:end;width:min(100%,440px);max-width:100%;align-self:flex-end}.controls button{border:1px solid #d5b46b;border-radius:12px;padding:12px 15px;background:linear-gradient(#3a3155,#11162b);color:#fff0c2;font-weight:800}.controls button:active{transform:scale(.96)}.controls button{touch-action:none;user-select:none;-webkit-user-select:none;font-size:10px;letter-spacing:.5px;padding:12px 3px;min-height:42px;box-shadow:inset 0 1px 0 #ffffff22,0 5px 14px #0008}#left,#right{min-width:0}.controls button:nth-child(5),.controls button:nth-child(6),.controls button:nth-child(7){background:linear-gradient(145deg,#6b2747,#251329);border-color:#e06a83}.controls button:nth-child(7){background:linear-gradient(145deg,#265b83,#15223f);border-color:#7bd8ff}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#080b17;z-index:5;letter-spacing:3px;font-size:13px;transition:opacity .6s}#loading.done{opacity:0;pointer-events:none}#back{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:4;pointer-events:auto;color:#f4d58a;text-decoration:none;border:1px solid #8c7146;border-radius:10px;padding:8px 10px;background:#090e20bb;font:12px system-ui}@media(min-width:800px){#hud{padding-left:28px;padding-right:28px}.bottom{flex-direction:row;align-items:end}.caption{font-size:15px;max-width:55%}.controls{width:min(58vw,520px);max-width:58%}}</style></head><body><div id="scene"></div><div id="loading">FORGING THE ARENA…</div><a id="back" href="./">← MAIN GAME</a><div id="hud"><div><div class="top"><div class="brand">A² PRESENTS<b>MYTHBEASTS CLASH</b></div><div class="phase">PROTOTYPE I<br>THE FIRST CONVERGENCE</div></div><div class="bars"><div><div class="fighter-label"><span>CHAMPION · AETHRYON</span><span>VITALITY</span></div><div class="bar"><i id="heroHp"></i></div></div><div><div class="fighter-label"><span>THE TITAN · ATROX</span><span>VITALITY</span></div><div class="bar enemy"><i id="bossHp"></i></div></div></div></div><div class="bottom"><div class="caption" id="caption">THE ARENA AWAKENS. CHOOSE YOUR FATE.</div><div class="controls"><button id="left" aria-label="Move left">◀</button><button id="right" aria-label="Move right">▶</button><button id="forward" aria-label="Move forward">▲</button><button id="backMove" aria-label="Move back">▼</button><button id="attack">ATTACK</button><button id="dodge">DODGE</button><button id="skill">UNLEASH</button><button id="camera">CAM</button></div></div></div><div id="diagnostic" style="display:none;position:fixed;z-index:20;inset:12px;padding:18px;border:1px solid #ff7b86;border-radius:14px;background:#160d19;color:#fff;font:14px/1.5 system-ui;white-space:pre-wrap;overflow:auto"><b>MYTHBEASTS CLASH · STARTUP DIAGNOSTIC</b><p id="diagnosticText"></p><button onclick="location.reload()" style="padding:10px 16px;border-radius:9px">RETRY</button></div>
<script>
(function(){
 var box=document.getElementById("diagnostic"),msg=document.getElementById("diagnosticText");
 function fail(label,detail){box.style.display="block";msg.textContent=label+"\\n"+String(detail||"Unknown error").slice(0,1800);var l=document.getElementById("loading");if(l)l.style.display="none";}
 window.addEventListener("error",function(e){fail("JavaScript / WebGL error",e.message+"\\n"+(e.filename||"")+" : "+(e.lineno||""));});
 window.addEventListener("unhandledrejection",function(e){fail("Unhandled startup rejection",e.reason&&e.reason.stack||e.reason);});
 setTimeout(function(){var l=document.getElementById("loading");if(l&&!l.classList.contains("done"))fail("3D engine did not finish starting","The startup module did not complete within 12 seconds. Check WebGL support and module loading.");},12000);
})();
</script>
<script type="module" src="./src/arena3d.js"></script></body></html>
