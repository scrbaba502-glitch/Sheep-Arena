name = "sheep-arena"
main = "src/index.ts"
compatibility_date = "2026-11-11"
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "MATCH_ROOMS"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

